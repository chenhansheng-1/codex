<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 墨上书阁 · 图书管理系统</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">📖</div>
                <h2>墨上书阁</h2>
                <p class="logo-subtitle">图书管理系统</p>
            </div>
            <nav class="sidebar-nav">
                <p class="sidebar-nav-title">导航菜单</p>
                <a href="#" class="nav-item active" onclick="loadBooks(); return false;">
                    <span class="nav-icon">📚</span>
                    <span>全部图书</span>
                    <span class="nav-badge" id="totalBadge">0</span>
                </a>
                <a href="#" class="nav-item" onclick="filterLowStock(); return false;">
                    <span class="nav-icon">⚠️</span>
                    <span>库存不足</span>
                    <span class="nav-badge warning" id="lowStockBadge">0</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="stats-card">
                    <span class="stat-label">藏书总量</span>
                    <span class="stat-value" id="statTotal">0</span>
                </div>
                <div class="stats-card">
                    <span class="stat-label">库存总数</span>
                    <span class="stat-value" id="statStock">0</span>
                </div>
            </div>
        </aside>

        <!-- 主内容 -->
        <main class="main-content">
            <!-- 顶部栏 -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1 id="pageTitle">📚 全部图书</h1>
                </div>
                <div class="topbar-right">
                    <div class="search-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="搜索书名、作者..." oninput="searchBooks()">
                        <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
                    </div>
                    <button class="btn btn-primary" onclick="openModal()">
                        <span class="btn-icon">＋</span>
                        <span>添加图书</span>
                    </button>
                </div>
            </header>

            <!-- 图书网格 -->
            <section class="book-grid" id="bookGrid">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>正在加载藏书...</p>
                </div>
            </section>
        </main>
    </div>

    <!-- 图书详情/编辑弹窗 -->
    <div id="bookModal" class="modal-overlay" style="display:none;">
        <div class="modal-container">
            <div class="modal-header">
                <h2 id="modalTitle">📖 添加图书</h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="bookForm" class="modal-body">
                <input type="hidden" id="bookId">
                <div class="form-section">
                    <div class="form-row row-2col">
                        <div class="form-group">
                            <label>书名 <span class="required">*</span></label>
                            <input type="text" id="title" placeholder="例：百年孤独" required>
                        </div>
                        <div class="form-group">
                            <label>作者 <span class="required">*</span></label>
                            <input type="text" id="author" placeholder="例：加西亚·马尔克斯" required>
                        </div>
                    </div>
                    <div class="form-row row-2col">
                        <div class="form-group">
                            <label>ISBN</label>
                            <input type="text" id="isbn" placeholder="978-X-XXX-XXXXX-X">
                        </div>
                        <div class="form-group">
                            <label>出版社</label>
                            <input type="text" id="publisher" placeholder="例：人民文学出版社">
                        </div>
                    </div>
                    <div class="form-row row-2col">
                        <div class="form-group">
                            <label>出版年份</label>
                            <input type="text" id="publishYear" placeholder="例：2008">
                        </div>
                        <div class="form-group">
                            <label>库存 <span class="required">*</span></label>
                            <input type="number" id="stock" min="0" placeholder="0">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>简介</label>
                            <textarea id="description" rows="3" placeholder="简单介绍这本书..."></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
                    <button type="submit" class="btn btn-primary">
                        <span class="btn-icon">✓</span>
                        <span id="submitBtnText">确认添加</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="deleteModal" class="modal-overlay" style="display:none;">
        <div class="modal-container modal-sm">
            <div class="modal-header">
                <h2>🗑️ 确认删除</h2>
                <button class="modal-close" onclick="closeDeleteModal()">✕</button>
            </div>
            <div class="modal-body">
                <p class="delete-text">确定要删除 <strong id="deleteBookTitle"></strong> 吗？</p>
                <p class="delete-hint">此操作不可撤销。</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">取消</button>
                <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">确认删除</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" style="display:none;"></div>

    <script src="/js/app.js"></script>
</body>
</html>
